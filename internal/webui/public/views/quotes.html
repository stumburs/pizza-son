<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes · pizza-son</title>
    <link rel="icon" type="image/webp" href="https://cdn.7tv.app/emote/01K6B3Y3SG5ZBAWXXVKX7BKBE5/4x.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --surface: #131315;
        --surface-2: #19191c;
        --border: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #ededf0;
        --text-secondary: #b8b8c2;
        --text-muted: #90909b;
        --accent: #b7a6f5;
        --danger: #f08a8a;
        --radius: 10px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 920px;
        margin: 0 auto;
        padding: 30px 24px 56px;
      }

      .intro {
        margin-bottom: 22px;
      }

      .title-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .header-sub {
        color: var(--text-muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .intro p {
        margin: 0;
        max-width: 620px;
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .intro code {
        color: var(--text);
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 0.88em;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .search {
        flex: 1 1 240px;
        min-width: 200px;
      }

      .search input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        color: var(--text);
        font-family: inherit;
        font-size: 0.94rem;
        outline: none;
        transition: border-color 0.15s;
      }

      .search input::placeholder {
        color: var(--text-muted);
      }

      .search input:focus {
        border-color: var(--accent);
      }

      .refresh {
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }

      .refresh:hover {
        border-color: var(--border-strong);
        background: #1f1f23;
      }

      .refresh:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .status {
        flex: 1 1 100%;
        color: var(--text-muted);
        font-size: 0.8rem;
      }

      .status.error {
        color: var(--danger);
      }

      .channel-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      .channel-tab {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        margin-bottom: -1px;
        padding: 8px 1px 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
      }

      .channel-tab:hover {
        color: var(--text);
      }

      .channel-tab.active {
        color: var(--text);
        border-bottom-color: var(--accent);
      }

      .channel-tab .count {
        color: var(--text-muted);
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 0.72rem;
        font-weight: 400;
      }

      .channel-tab.active .count {
        color: var(--accent);
      }

      .quote-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .quote {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr);
        gap: 14px;
        padding: 17px 4px;
        border-bottom: 1px solid var(--border);
      }

      .quote-index {
        padding-top: 2px;
        color: var(--text-muted);
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .quote-text {
        margin: 0;
        color: var(--text);
        font-size: 0.97rem;
        line-height: 1.62;
        overflow-wrap: anywhere;
      }

      .quote-text .emote {
        height: 1.5em;
        vertical-align: middle;
      }

      .quote-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        margin-top: 7px;
        color: var(--text-muted);
        font-size: 0.78rem;
      }

      .quote-meta .dot {
        opacity: 0.6;
      }

      .quote-meta .added-by {
        color: var(--text-secondary);
      }

      .empty {
        padding: 40px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--text-secondary);
        text-align: center;
      }

      .refresh-note {
        margin: 18px 0 0;
        color: var(--text-muted);
        font-size: 0.78rem;
      }

      @media (max-width: 560px) {
        .page {
          padding: 24px 16px 44px;
        }

        .quote {
          grid-template-columns: 32px minmax(0, 1fr);
          gap: 10px;
        }

        .quote-index {
          font-size: 0.74rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="title-row">
          <h1>Quotes</h1>
          <span class="header-sub" id="quoteTotal"></span>
        </div>
        <p>
          Things people said in chat, saved with <code>!quote</code>.
        </p>
      </header>

      <div class="controls">
        <label class="search">
          <span class="sr-only">Search quotes</span>
          <input id="search" type="search" placeholder="Search quotes or names…" autocomplete="off" />
        </label>
        <button class="refresh" id="refresh" type="button">Refresh</button>
        <div class="status" id="status" role="status">Loading quotes…</div>
      </div>

      <nav class="channel-tabs" id="channelTabs" aria-label="Quote channels"></nav>

      <section class="quote-list" id="quoteList" aria-live="polite">
        <div class="empty">Loading quotes…</div>
      </section>

      <p class="refresh-note">Refreshes automatically while this tab is open.</p>
    </main>

    <script src="/view.js"></script>
    <script>
      const API_URL = "/api/quotes";
      const REFRESH_MS = 60_000;

      const state = {
        channels: [],
        total: 0,
        active: (new URLSearchParams(location.search).get("channel") || "").trim().toLowerCase(),
        query: "",
        loading: false,
      };

      const statusEl = document.getElementById("status");
      const totalEl = document.getElementById("quoteTotal");
      const tabsEl = document.getElementById("channelTabs");
      const listEl = document.getElementById("quoteList");
      const searchEl = document.getElementById("search");
      const refreshEl = document.getElementById("refresh");

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => {
          switch (char) {
            case "&":
              return "&amp;";
            case "<":
              return "&lt;";
            case ">":
              return "&gt;";
            case '"':
              return "&quot;";
            default:
              return "&#39;";
          }
        });
      }

      function formatCount(value) {
        return new Intl.NumberFormat().format(Number(value) || 0);
      }

      function selectedChannel() {
        return state.channels.find((channel) => channel.name === state.active);
      }

      function renderTabs() {
        tabsEl.innerHTML = state.channels
          .map(
            (channel) => `
            <button
              class="channel-tab${channel.name === state.active ? " active" : ""}"
              type="button"
              data-channel="${escapeHtml(channel.name)}"
              aria-pressed="${channel.name === state.active}"
            >
              <span>${escapeHtml(channel.name)}</span>
              <span class="count">${formatCount(channel.count)}</span>
            </button>`
          )
          .join("");

        totalEl.textContent = state.total
          ? `${formatCount(state.total)} total`
          : "";
      }

      function visibleQuotes() {
        const channel = selectedChannel();
        if (!channel) return [];

        const query = state.query.trim().toLowerCase();
        return channel.quotes.filter((quote) => {
          if (!query) return true;
          return (
            quote.text.toLowerCase().includes(query) ||
            (quote.added_by || "").toLowerCase().includes(query)
          );
        });
      }

      function renderQuotes() {
        const entries = visibleQuotes();

        if (entries.length === 0) {
          let message = "No quotes have been saved yet.";
          if (state.total > 0) {
            message = state.query.trim()
              ? "No quotes match that search."
              : "No quotes in this channel yet.";
          }
          listEl.innerHTML = `<div class="empty">${message}</div>`;
          return;
        }

        listEl.innerHTML = entries
          .map(
            (quote) => `
            <article class="quote">
              <span class="quote-index">${quote.number}</span>
              <div>
                <p class="quote-text">${quote.html}</p>
                <div class="quote-meta">
                  <span class="added-by">${escapeHtml(quote.added_by || "unknown")}</span>
                  ${quote.created_at ? `<span class="dot">·</span><span>${escapeHtml(quote.created_at)}</span>` : ""}
                </div>
              </div>
            </article>`
          )
          .join("");
      }

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      async function load(initial) {
        if (state.loading) return;
        state.loading = true;
        refreshEl.disabled = true;
        if (initial) setStatus("Loading quotes…", false);

        try {
          const response = await fetch(API_URL, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const data = await response.json();
          state.channels = Array.isArray(data.channels) ? data.channels : [];
          state.total = Number(data.total) || 0;

          if (!selectedChannel()) {
            state.active = state.channels[0]?.name || "";
          }

          renderTabs();
          renderQuotes();

          const stamp = data.generated_at
            ? new Date(data.generated_at).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              })
            : "";
          setStatus(stamp ? `Updated ${stamp}` : "Updated", false);
        } catch (error) {
          setStatus("Could not load quotes. Retrying automatically.", true);
          if (state.total === 0) {
            listEl.innerHTML = `<div class="empty">Quotes could not be loaded. They will retry automatically.</div>`;
          }
        } finally {
          state.loading = false;
          refreshEl.disabled = false;
        }
      }

      tabsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-channel]");
        if (!button) return;
        state.active = button.dataset.channel;
        renderTabs();
        renderQuotes();
      });

      searchEl.addEventListener("input", () => {
        state.query = searchEl.value;
        renderQuotes();
      });

      refreshEl.addEventListener("click", () => load(false));

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load(false);
      });

      setInterval(() => {
        if (!document.hidden) load(false);
      }, REFRESH_MS);

      load(true);
    </script>
  </body>
</html>
